<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV 引擎控制台</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --border:#e3e6ea; --text:#1f2328;
  --muted:#6b7280; --accent:#2563eb; --accent-soft:#eff4ff;
  --green:#16a34a; --green-soft:#e8f7ee;
  --amber:#d97706; --amber-soft:#fef3e2;
  --red:#dc2626; --red-soft:#fdeaea;
  --gray-soft:#f0f1f3;
  --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
              "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:212px;flex-shrink:0;background:var(--panel);
  border-right:1px solid var(--border);padding:20px 12px;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 20px}
.brand-icon{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700;
}
.brand-text b{display:block;font-size:14.5px;letter-spacing:-.2px}
.brand-text span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  color:var(--muted);cursor:pointer;font-size:13.5px;user-select:none;
  transition:background .13s,color .13s;
}
.nav-item:hover{background:var(--gray-soft);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .ico{width:17px;text-align:center;font-size:14px}
.nav-sep{height:1px;background:var(--border);margin:12px 8px}
.side-foot{margin-top:auto;padding:10px 8px 0;font-size:11px;color:var(--muted);line-height:1.7}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--green)} .dot.off{background:var(--muted)}
.dot.busy{background:var(--amber);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--panel);border-bottom:1px solid var(--border);
  padding:14px 26px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:17px;font-weight:650;letter-spacing:-.2px}
.topbar .sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.content{padding:22px 26px 44px;max-width:1560px;width:100%}

/* ---------- 卡片 ---------- */
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;
}
.card-head{
  padding:13px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.card-head h2{font-size:14px;font-weight:620}
.card-head .desc{font-size:12px;color:var(--muted)}
.card-body{padding:18px}
.card-body.tight{padding:0}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
      padding:15px 17px;box-shadow:var(--shadow)}
.stat .label{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.stat .value{font-size:25px;font-weight:680;letter-spacing:-.6px;line-height:1.15}
.stat .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.stat.hl .value{color:var(--accent)}
.stat.good .value{color:var(--green)}

/* ---------- 控件 ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;
  border:1px solid var(--border);background:#fff;color:var(--text);
  font-size:13px;cursor:pointer;font-family:inherit;
  transition:background .13s,border-color .13s,opacity .13s;
}
.btn:hover:not(:disabled){background:var(--gray-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:#1d4fd7}
.btn.danger{color:var(--red);border-color:#f3c6c6}
.btn.danger:hover:not(:disabled){background:var(--red-soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
input[type=text],input[type=number],select{
  padding:6.5px 10px;border:1px solid var(--border);border-radius:7px;
  font-size:13px;font-family:inherit;background:#fff;color:var(--text);outline:none;
}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:9px 14px;font-weight:600;font-size:12px;color:var(--muted);
  border-bottom:1px solid var(--border);background:#fafbfc;white-space:nowrap;
  position:sticky;top:0;
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
td{padding:9px 14px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfc}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.ch-name{display:flex;align-items:center;gap:9px}
.ch-logo{width:32px;height:19px;border-radius:3px;object-fit:cover;
         background:var(--gray-soft);flex-shrink:0;border:1px solid var(--border)}
.ch-title{font-weight:550;line-height:1.35}
.ch-url{font-size:11px;color:var(--muted);word-break:break-all;max-width:330px;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{opacity:0;transition:opacity .13s}
tr:hover .copy{opacity:1}

.badge{
  display:inline-block;padding:1.5px 7px;border-radius:20px;
  font-size:11.5px;font-weight:560;white-space:nowrap;
}
.badge.active{background:var(--green-soft);color:var(--green)}
.badge.pending{background:var(--gray-soft);color:var(--muted)}
.badge.degraded{background:var(--amber-soft);color:var(--amber)}
.badge.retired{background:var(--red-soft);color:var(--red)}
.badge.720{background:#e0f2fe;color:#0369a1}
.badge.1080{background:#dcfce7;color:#15803d}
.badge.2160{background:#f3e8ff;color:#7e22ce}
.badge.sd{background:var(--gray-soft);color:var(--muted)}

/* 分组条 */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-label{width:72px;font-size:12.5px;text-align:right;color:var(--muted);flex-shrink:0}
.bar-track{flex:1;height:19px;background:var(--gray-soft);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);
          border-radius:5px;transition:width .4s ease;min-width:2px}
.bar-val{width:38px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---------- 日志 ---------- */
.log{
  background:#0f172a;color:#cbd5e1;border-radius:9px;padding:14px 16px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.65;height:420px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-word;
}
.log::-webkit-scrollbar{width:8px}
.log::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.log .ERR{color:#fca5a5} .log .WARN{color:#fcd34d} .log .INFO{color:#93c5fd}

.running-bar{
  display:flex;align-items:center;gap:10px;padding:9px 14px;margin-bottom:12px;
  background:var(--accent-soft);border-radius:8px;font-size:13px;color:var(--accent);
}
.spin{width:13px;height:13px;border:2px solid rgba(37,99,235,.25);
      border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 预览 ---------- */
.preview{
  background:#0f172a;color:#cbd5e1;border-radius:9px;padding:14px 16px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.7;max-height:460px;overflow:auto;
  white-space:pre;line-height:1.7;
}

/* ---------- 配置 ---------- */
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px}
.cfg-item{background:#fafbfc;border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.cfg-item .k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.cfg-item .v{font-size:13px;font-weight:520;word-break:break-all}
.kw-list{display:flex;flex-wrap:wrap;gap:6px}
.kw{background:var(--accent-soft);color:var(--accent);padding:3px 9px;
    border-radius:6px;font-size:12.5px}

.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
.note{
  background:var(--amber-soft);border:1px solid #f5d9a8;color:#92400e;
  padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px;
}
.note.info{background:var(--accent-soft);border-color:#c7dbff;color:#1e40af}
.page-bar{display:flex;align-items:center;gap:10px;padding:12px 18px;
          border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <!-- ============ 侧栏 ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">📺</div>
      <div class="brand-text"><b>IPTV 引擎</b><span>自动发现控制台</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-item active" data-view="dash"><span class="ico">📊</span>总览</div>
      <div class="nav-item" data-view="channels"><span class="ico">📺</span>频道管理</div>
      <div class="nav-item" data-view="run"><span class="ico">▶</span>运行控制</div>
      <div class="nav-item" data-view="output"><span class="ico">📄</span>产物预览</div>
      <div class="nav-sep"></div>
      <div class="nav-item" data-view="config"><span class="ico">⚙</span>配置查看</div>
    </nav>
    <div class="side-foot" id="sideFoot">加载中…</div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">总览</h1>
        <div class="sub" id="viewSub">引擎状态与统计</div>
      </div>
      <div class="spacer"></div>
      <div id="topActions" class="toolbar"></div>
    </header>

    <div class="content" id="content">
      <div class="empty"><div class="big">⏳</div>加载中…</div>
    </div>
  </main>
</div>

<script>
/* ================================================================
   状态
================================================================ */
const state = {
  view:'dash', overview:null, groups:[],
  ch:{page:1,size:25,q:'',status:'all',group:'all',sort:'score'},
  chData:null,
  task:{id:null,cursor:0,timer:null,logs:[],status:null},
  previewName:'live.m3u',
};
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts){
  const r = await fetch(path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
const post = (p,b) => api(p,{method:'POST',headers:{'Content-Type':'application/json'},
                                body:JSON.stringify(b||{})});

/* ================================================================
   视图切换
================================================================ */
const TITLES = {
  dash:     ['总览','引擎状态与统计'],
  channels: ['频道管理','注册表中的全部源'],
  run:      ['运行控制','手动触发完整流程'],
  output:   ['产物预览','生成的播放列表'],
  config:   ['配置查看','当前生效的配置'],
};

function switchView(v){
  state.view = v;
  $$('#nav .nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  $('#viewTitle').textContent = TITLES[v][0];
  $('#viewSub').textContent   = TITLES[v][1];
  $('#topActions').innerHTML  = '';
  render();
}

/* ================================================================
   总览
================================================================ */
async function loadOverview(){
  state.overview = await api('/api/overview');
  try{ state.groups = (await api('/api/groups')).groups || []; }catch(e){}
}

function renderDash(){
  const o = state.overview;
  if(!o) return;
  const st = o.registry.stats||{};
  const ffmpeg = o.ffmpeg||{};
  const files = o.files||{};
  const last = o.last_run;

  const taskChip = last
    ? `<span class="badge ${last.status==='done'?'active':(last.status==='running'?'degraded':'retired')}">${last.status}</span> ${esc(last.kind)} ${esc(last.started_at)}`
    : '<span class="muted tiny">暂无运行记录</span>';

  const runBtns = `
    <button class="btn primary" onclick="quickRun()" ${o.busy?'disabled':''}>▶ 立即运行</button>
    <button class="btn" onclick="switchView('run')">高级选项</button>`;

  const fileRows = ['live.m3u','live.txt','meta.json'].map(n=>{
    const info = files[n];
    return `<tr>
      <td class="mono">${esc(n)}</td>
      <td class="num">${info? (info.size/1024).toFixed(1)+' KB' : '—'}</td>
      <td class="muted tiny">${info? esc(info.mtime) : '未生成'}</td>
      <td style="text-align:right">
        ${info? `<a class="btn sm" href="/output/${n}" target="_blank">查看</a>
                  <a class="btn sm" href="/output/${n}?download=1">下载</a>` : '—'}
      </td></tr>`;
  }).join('');

  const groupBars = Object.entries(o.by_group||{}).map(([g,n])=>{
    const max = Math.max(...Object.values(o.by_group), 1);
    return `<div class="bar-row">
      <div class="bar-label">${esc(g)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div>
      <div class="bar-val">${n}</div></div>`;
  }).join('') || '<div class="muted">暂无活跃频道</div>';

  const qualBars = Object.entries(o.by_quality||{}).map(([q,n])=>{
    const max = Math.max(...Object.values(o.by_quality), 1);
    return `<div class="bar-row">
      <div class="bar-label">${esc(q)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div>
      <div class="bar-val">${n}</div></div>`;
  }).join('') || '<div class="muted">暂无画质数据</div>';

  return `
  ${!ffmpeg.available?`<div class="note">⚠ 未检测到 ffmpeg，解码验证（L5）会自动降级关闭，僵尸源可能混入播放列表。请把 ffmpeg 解压到项目根目录的 <code>ffmpeg/bin/</code>。</div>`:''}
  ${o.active_count===0?`<div class="note info">ℹ 注册表中还没有活跃频道。点击右上角「立即运行」执行一次完整流程，或到「运行控制」查看详细选项。</div>`:''}

  <div class="stats">
    <div class="stat hl">
      <div class="label">活跃频道</div>
      <div class="value">${o.active_count}</div>
      <div class="hint">共注册 ${o.registry.total} 条</div>
    </div>
    <div class="stat good">
      <div class="label">平均码率</div>
      <div class="value">${o.avg_bitrate_kbps}<span style="font-size:14px;font-weight:500"> kbps</span></div>
      <div class="hint">按活跃源统计</div>
    </div>
    <div class="stat">
      <div class="label">分组数</div>
      <div class="value">${Object.keys(o.by_group||{}).length}</div>
      <div class="hint">央视/卫视/体育…</div>
    </div>
    <div class="stat">
      <div class="label">待淘汰</div>
      <div class="value">${(st.degraded||0)+(st.pending||0)}</div>
      <div class="hint">降级 ${st.degraded||0} · 待定 ${st.pending||0}</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>最近运行</h2><span class="desc">任务状态</span></div>
    <div class="card-body" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      ${taskChip}
      <div class="spacer"></div>
      <div class="toolbar">${runBtns}</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px">
    <div class="card">
      <div class="card-head"><h2>分组分布</h2></div>
      <div class="card-body">${groupBars}</div>
    </div>
    <div class="card">
      <div class="card-head"><h2>画质分布</h2></div>
      <div class="card-body">${qualBars}</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>产物文件</h2><span class="desc">播放器可直接订阅 raw 链接</span></div>
    <div class="card-body tight">
      <div class="table-wrap"><table>
        <thead><tr><th>文件</th><th style="text-align:right">大小</th><th>更新时间</th><th style="text-align:right">操作</th></tr></thead>
        <tbody>${fileRows}</tbody>
      </table></div>
    </div>
  </div>`;
}

/* ================================================================
   频道管理
================================================================ */
const STATUS_LABEL = {active:'活跃',pending:'待定',degraded:'降级',retired:'已淘汰'};

function qualBadge(w,h){
  if(!h) return '<span class="badge sd">未知</span>';
  const c = h>=2160?'2160':(h>=1080?'1080':(h>=720?'720':'sd'));
  const t = h>=2160?'4K':(h>=1080?'1080P':(h>=720?'720P':(h+'P')));
  return `<span class="badge ${c}">${t}</span>`;
}

async function loadChannels(){
  const c = state.ch;
  const qs = new URLSearchParams({page:c.page,size:c.size,q:c.q,status:c.status,
                                  group:c.group,sort:c.sort});
  state.chData = await api('/api/channels?'+qs);
  return state.chData;
}

/* 频道页统一入口：先取数再渲染。
   早期版本 render() 切页时只调 renderChannels() 而没调 loadChannels()，
   state.chData 为 null 导致页面永远停在「加载中…」。 */
async function goChannels(){
  $('#content').innerHTML =
    '<div class="empty"><div class="big">⏳</div>加载中…</div>';
  try{
    await loadChannels();
    renderChannels();
  }catch(e){
    state.chData = null;
    $('#content').innerHTML = `<div class="card"><div class="empty">
      <div class="big">⚠</div><div>加载失败：${esc(e.message)}</div>
      <div class="tiny" style="margin-top:8px">
        <button class="btn" onclick="goChannels()">重试</button></div></div></div>`;
    return;
  }
}

/* 仅重绘，不重新取数（筛选变化后调用） */
function renderChannels(){
  $('#topActions').innerHTML =
    `<input type="text" id="q" placeholder="搜索名称/地址/tvg-id…" value="${esc(state.ch.q)}"
       style="width:230px" onkeydown="if(event.key==='Enter'){state.ch.q=this.value;state.ch.page=1;goChannels()}">
     <select onchange="state.ch.status=this.value;state.ch.page=1;goChannels()">
       <option value="all">全部状态</option>
       <option value="active">仅活跃</option><option value="pending">待定</option>
       <option value="degraded">降级</option><option value="retired">已淘汰</option>
     </select>
     <select onchange="state.ch.group=this.value;state.ch.page=1;goChannels()">
       <option value="all">全部分组</option>
       ${state.groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}
     </select>
     <select onchange="state.ch.sort=this.value;state.ch.page=1;goChannels()">
       <option value="score">按评分</option><option value="name">按名称</option>
       <option value="bitrate">按码率</option><option value="height">按分辨率</option>
       <option value="recent">按最后验证</option><option value="found">按发现时间</option>
     </select>
     <button class="btn" onclick="state.ch.q='';state.ch.page=1;goChannels()">重置</button>`;

  const d = state.chData;
  if(!d){
    $('#content').innerHTML =
      '<div class="empty"><div class="big">📭</div>暂无数据，点击右上角「重置」重新加载</div>';
    return;
  }

  // 同步下拉选中状态
  setTimeout(()=>{
    const sels = $$('#topActions select');
    if(sels[0]) sels[0].value = state.ch.status;
    if(sels[1]) sels[1].value = state.ch.group;
    if(sels[2]) sels[2].value = state.ch.sort;
  },0);

  if(!d.items.length){
    $('#content').innerHTML = `<div class="card"><div class="empty">
      <div class="big">📭</div>
      <div>没有符合条件的频道</div>
      <div class="tiny" style="margin-top:6px">试试调整筛选条件，或先运行一次流程</div>
    </div></div>`;
    return;
  }

  const rows = d.items.map(it=>`
    <tr>
      <td>
        <div class="ch-name">
          ${it.logo? `<img class="ch-logo" src="${esc(it.logo)}" alt="" loading="lazy"
                       onerror="this.style.visibility='hidden'">`
                    : `<div class="ch-logo"></div>`}
          <div style="min-width:0">
            <div class="ch-title">${esc(it.name||'未命名')}</div>
            <div class="ch-url" title="${esc(it.url)}">${esc(it.url)}</div>
          </div>
        </div>
      </td>
      <td><span class="badge pending" style="background:var(--gray-soft);color:var(--muted)">${esc(it.group)}</span></td>
      <td><span class="badge ${it.status}">${STATUS_LABEL[it.status]||it.status}</span></td>
      <td>${qualBadge(it.width,it.height)}</td>
      <td class="num">${it.bitrate_kbps? it.bitrate_kbps+' kbps':'—'}</td>
      <td class="num">${it.score? it.score.toFixed(1):'—'}</td>
      <td class="tiny muted">${esc((it.last_checked_at||'').replace('T',' ').slice(5))}</td>
      <td class="tiny muted" title="${esc(it.last_error||'')}">
        ${it.consecutive_failures? `失败×${it.consecutive_failures} ${esc((it.last_stage||''))}` :
          esc((it.found_via||'').split(':')[0])}
      </td>
      <td style="text-align:right">
        <button class="btn sm copy" onclick="copyUrl('${esc(it.url).replace(/'/g,"\\'")}')">复制</button>
      </td>
    </tr>`).join('');

  const from = (d.page-1)*d.size+1, to = Math.min(d.page*d.size, d.total);
  $('#content').innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2>频道列表</h2>
        <span class="desc">共 ${d.total} 条 · 显示 ${from}-${to}</span>
      </div>
      <div class="card-body tight"><div class="table-wrap"><table>
        <thead><tr>
          <th>频道</th><th>分组</th><th>状态</th><th>画质</th>
          <th style="text-align:right">码率</th><th style="text-align:right">评分</th>
          <th>最后验证</th><th>备注</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>
      <div class="page-bar">
        <button class="btn sm" ${d.page<=1?'disabled':''} onclick="state.ch.page--;goChannels()">上一页</button>
        <span>第 ${d.page} / ${d.pages} 页</span>
        <button class="btn sm" ${d.page>=d.pages?'disabled':''} onclick="state.ch.page++;goChannels()">下一页</button>
        <div class="spacer"></div>
        <select onchange="state.ch.size=+this.value;state.ch.page=1;goChannels()">
          ${[25,50,100,200].map(n=>`<option value="${n}" ${state.ch.size==n?'selected':''}>${n} 条/页</option>`).join('')}
        </select>
      </div>
    </div>`;
}

/* ================================================================
   运行控制
================================================================ */
const RUN_STATE = {skip_discovery:false, skip_validation:false, skip_publish:false, max_check:0};

function renderRun(){
  $('#topActions').innerHTML =
    `<button class="btn primary" id="btnRun" onclick="doRun()">▶ 开始运行</button>
     <button class="btn" onclick="clearLog()">清空日志</button>`;

  const busy = state.task.status==='running';
  $('#content').innerHTML = `
    <div class="card">
      <div class="card-head"><h2>运行选项</h2>
        <span class="desc">默认执行：发现 → 验证 → 渲染 → 发布</span></div>
      <div class="card-body">
        <div class="toolbar" style="gap:20px;flex-wrap:wrap">
          <label class="chk"><input type="checkbox" id="skip_discovery"
            ${RUN_STATE.skip_discovery?'checked':''} ${busy?'disabled':''}> 跳过发现（只巡检已有源）</label>
          <label class="chk"><input type="checkbox" id="skip_validation"
            ${RUN_STATE.skip_validation?'checked':''} ${busy?'disabled':''}> 跳过验证（不检查可播性）</label>
          <label class="chk"><input type="checkbox" id="skip_publish"
            ${RUN_STATE.skip_publish?'checked':''} ${busy?'disabled':''}> 跳过发布（不推 GitHub）</label>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="muted tiny">验证上限</span>
            <input type="number" id="max_check" value="${RUN_STATE.max_check}" min="0"
                   style="width:80px" ${busy?'disabled':''}>
            <span class="muted tiny">条（0 = 用配置默认值）</span>
          </div>
        </div>
        <div class="toolbar" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
          <button class="btn" onclick="doDemo()" ${busy?'disabled':''}>🎬 演示模式（生成本地可播流）</button>
          <span class="muted tiny">用 ffmpeg 生成真实 HLS 流，验证完整链路并产出播放列表</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>运行日志</h2>
        <span class="desc" id="logStatus">${busy?'运行中…':'空闲'}</span></div>
      <div class="card-body">
        ${busy?'<div class="running-bar"><div class="spin"></div>任务运行中，日志实时更新…</div>':''}
        <div class="log" id="logBox">${state.task.logs.join('\n')||'（暂无日志，点击「开始运行」）'}</div>
      </div>
    </div>`;

  const box = $('#logBox');
  if(box) box.scrollTop = box.scrollHeight;
}

function clearLog(){
  state.task.logs = []; state.task.cursor = 0; state.task.id = null;
  stopPoll(); renderRun();
}

async function doRun(){
  RUN_STATE.skip_discovery = $('#skip_discovery').checked;
  RUN_STATE.skip_validation = $('#skip_validation').checked;
  RUN_STATE.skip_publish   = $('#skip_publish').checked;
  RUN_STATE.max_check      = parseInt($('#max_check').value||'0', 10);

  state.task.logs = []; state.task.cursor = 0; state.task.status = 'running';
  renderRun();
  try{
    const r = await post('/api/run', RUN_STATE);
    if(!r.ok){ state.task.status=null; alert(r.message||'启动失败'); renderRun(); return; }
    state.task.id = r.task_id;
    pollTask();
  }catch(e){
    state.task.status = null; alert('启动失败：'+e.message); renderRun();
  }
}

async function doDemo(){
  state.task.logs = []; state.task.cursor = 0; state.task.status='running';
  renderRun();
  const r = await post('/api/demo');
  if(!r.ok){ state.task.status=null; alert(r.message); renderRun(); return; }
  state.task.id = r.task_id; pollTask();
}

async function quickRun(){
  if(state.overview && state.overview.busy){ alert('已有任务在运行'); return; }
  switchView('run');
  setTimeout(doRun, 120);
}

/* 轮询任务日志 */
function pollTask(){
  stopPoll();
  state.task.timer = setInterval(async ()=>{
    if(!state.task.id) return stopPoll();
    try{
      const d = await api(`/api/task?id=${state.task.id}&cursor=${state.task.cursor}`);
      if(d.error){ stopPoll(); return; }
      if(d.logs && d.logs.length){
        state.task.cursor = d.cursor;
        d.logs.forEach(l=>{
          state.task.logs.push(l);
          const cls = l.includes('[ERR]')?'ERR':(l.includes('[WARN]')?'WARN':'INFO');
          state.task.logs[state.task.logs.length-1] =
            `<span class="${cls}">${esc(l)}</span>`;
        });
      }
      state.task.status = d.status;
      if(d.status!=='running'){
        stopPoll();
        await loadOverview();
        if(state.view==='run') renderRun(); else render();
        toast(d.status==='done' ? '任务完成' : '任务失败：'+(d.error||''));
      }else if(state.view==='run'){
        const box = $('#logBox');
        if(box){ box.innerHTML = state.task.logs.join('\n'); box.scrollTop = box.scrollHeight; }
        const ls = $('#logStatus'); if(ls) ls.textContent = '运行中…';
      }
    }catch(e){ stopPoll(); }
  }, 900);
}
function stopPoll(){ if(state.task.timer){ clearInterval(state.task.timer); state.task.timer=null; } }

/* ================================================================
   产物预览
================================================================ */
async function renderOutput(){
  $('#topActions').innerHTML =
    `<select onchange="state.previewName=this.value;renderOutput()">
       <option value="live.m3u">live.m3u</option>
       <option value="live.txt">live.txt</option>
       <option value="meta.json">meta.json</option>
     </select>
     <a class="btn" href="/output/${state.previewName}" target="_blank">新窗口打开</a>
     <a class="btn" href="/output/${state.previewName}?download=1">下载</a>`;

  let d;
  try{ d = await api('/api/preview?name='+state.previewName); }catch(e){}
  if(!d || d.error){
    $('#content').innerHTML = `<div class="card"><div class="empty">
      <div class="big">📄</div><div>${esc(d?.error||'加载失败')}</div>
      <div class="tiny" style="margin-top:8px">先运行一次流程生成产物</div></div></div>`;
    return;
  }
  const ext = d.name==='meta.json' ? 'json' : 'txt';
  $('#content').innerHTML = `
    <div class="card">
      <div class="card-head">
        <h2>${esc(d.name)}</h2>
        <span class="desc">${(d.size/1024).toFixed(1)} KB · 共 ${d.total_lines} 行</span>
      </div>
      <div class="card-body">
        ${d.truncated?`<div class="note info">ℹ 仅显示前 ${d.lines.length} 行（共 ${d.total_lines} 行）</div>`:''}
        <pre class="preview">${esc(d.lines.join('\n'))}</pre>
      </div>
    </div>`;
}

/* ================================================================
   配置
================================================================ */
async function renderConfig(){
  $('#topActions').innerHTML = `<a class="btn" href="${esc('/api/config')}" target="_blank">原始 JSON</a>`;
  let c;
  try{ c = await api('/api/config'); }catch(e){}
  if(!c || c.error){ $('#content').innerHTML = `<div class="card"><div class="empty"><div class="big">⚠</div>${esc(c?.error||'加载失败')}</div></div>`; return; }

  const v = c.validation||{}, l = c.lifecycle||{}, o = c.output||{};
  const kws = (c.search_keywords||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('');
  const seeds = (c.seed_repositories||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('');
  const engs = (c.engines||[]).map(e=>
    `<span class="badge ${e.enabled?'active':'retired'}">${esc(e.name)} ${e.enabled?'启用':'停用'}</span>`).join(' ');

  const item = (k,val) => `<div class="cfg-item"><div class="k">${esc(k)}</div><div class="v">${val}</div></div>`;

  $('#content').innerHTML = `
    <div class="note">ℹ 配置界面为<b>只读</b>。需要调整请直接编辑 <code>${esc(c.config_path)}</code>，
    以免程序改写破坏文件中的注释。改完刷新本页即可看到新值。</div>

    <div class="card">
      <div class="card-head"><h2>发现配置</h2><span class="desc">搜索关键词与引擎</span></div>
      <div class="card-body">
        <div class="cfg-item" style="margin-bottom:12px">
          <div class="k">搜索引擎</div><div class="v">${engs||'<span class="muted">无</span>'}</div>
        </div>
        <div class="cfg-item" style="margin-bottom:12px">
          <div class="k">搜索关键词（${(c.search_keywords||[]).length}）</div>
          <div class="kw-list" style="margin-top:6px">${kws||'<span class="muted">无</span>'}</div>
        </div>
        <div class="cfg-item">
          <div class="k">冷启动种子（${(c.seed_repositories||[]).length}）</div>
          <div class="kw-list" style="margin-top:6px">${seeds||'<span class="muted">无</span>'}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>验证门槛</h2><span class="desc">决定源能否入库</span></div>
      <div class="card-body"><div class="cfg-grid">
        ${item('强制解码验证', v.require_decode===true?'<span class="badge active">开启</span>':'<span class="badge retired">关闭</span>')}
        ${item('最低视频码率', (v.min_video_kbps??'—')+' kbps')}
        ${item('最低分辨率宽度', (v.min_resolution_width??'—')+' px')}
        ${item('连续失败淘汰', (v.max_consecutive_failures??'—')+' 次')}
      </div></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>生命周期与输出</h2></div>
      <div class="card-body"><div class="cfg-grid">
        ${item('闲置淘汰天数', (l.max_idle_days??'—')+' 天')}
        ${item('单轮验证上限', (l.max_check_per_run??'—')+' 条')}
        ${item('排序依据', esc(o.sort_by||'—'))}
        ${item('GitHub 发布', c.publish_enabled?'<span class="badge active">启用</span>':'<span class="badge retired">停用</span>')}
      </div></div>
    </div>`;
}

/* ================================================================
   路由
================================================================ */
async function render(){
  if(state.view==='dash'){
    await loadOverview();
    $('#content').innerHTML = renderDash();
    const o = state.overview;
    $('#topActions').innerHTML = `
      <button class="btn" onclick="refresh()">↻ 刷新</button>
      <button class="btn primary" onclick="quickRun()" ${o.busy?'disabled':''}>▶ 立即运行</button>`;
    $('#sideFoot').innerHTML = `
      <div><span class="dot ${o.busy?'busy':'ok'}"></span>${o.busy?'任务运行中':'空闲'}</div>
      <div><span class="dot ${o.ffmpeg.available?'ok':'off'}"></span>ffmpeg ${o.ffmpeg.available?'可用':'缺失'}</div>
      <div style="margin-top:6px">活跃 ${o.active_count} / 总 ${o.registry.total}</div>`;
  }
  else if(state.view==='channels'){ await loadOverview(); await goChannels(); }
  else if(state.view==='run'){ await renderRun(); }
  else if(state.view==='output'){ await renderOutput(); }
  else if(state.view==='config'){ await renderConfig(); }
}

async function refresh(){ await render(); toast('已刷新'); }

function copyUrl(u){
  navigator.clipboard.writeText(u).then(()=>toast('已复制')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=u; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制');
  });
}

function toast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);'
    + 'background:#1f2328;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;'
    + 'z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.2)';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 1900);
}

/* 启动 */
$$('#nav .nav-item').forEach(n=>n.onclick=()=>switchView(n.dataset.view));

/* 全局兜底：任何未捕获的渲染异常都显式展示，
   否则页面会静默停在「加载中…」而看不出出了什么问题。 */
window.addEventListener('error', ev=>{
  const box = document.querySelector('#content');
  if(box && /加载中/.test(box.textContent)){
    box.innerHTML = `<div class="card"><div class="empty">
      <div class="big">⚠</div><div>页面渲染出错</div>
      <div class="tiny mono" style="margin-top:8px;color:#b91c1c">${esc(ev.message)}</div>
      <div class="tiny" style="margin-top:10px">
        <button class="btn" onclick="location.reload()">刷新页面</button></div>
      </div></div>`;
  }
});
window.addEventListener('unhandledrejection', ev=>{
  const box = document.querySelector('#content');
  if(box && /加载中/.test(box.textContent)){
    box.innerHTML = `<div class="card"><div class="empty">
      <div class="big">⚠</div><div>请求失败</div>
      <div class="tiny mono" style="margin-top:8px;color:#b91c1c">${esc(ev.reason?.message||ev.reason)}</div>
      <div class="tiny" style="margin-top:10px">
        <button class="btn" onclick="location.reload()">刷新页面</button></div>
      </div></div>`;
  }
});

render().catch(e=>{
  $('#content').innerHTML = `<div class="card"><div class="empty">
    <div class="big">⚠</div><div>加载失败：${esc(e.message)}</div>
    <div class="tiny" style="margin-top:10px">
      <button class="btn" onclick="location.reload()">刷新页面</button></div></div></div>`;
});
// 侧栏状态定期刷新
setInterval(()=>{ if(!state.task.timer) loadOverview().then(()=>{
  if(state.view==='dash') renderDash();
  const f = state.overview&&state.overview.ffmpeg;
  if(f) $('#sideFoot').innerHTML = `
    <div><span class="dot ${state.overview.busy?'busy':'ok'}"></span>${state.overview.busy?'任务运行中':'空闲'}</div>
    <div><span class="dot ${f.available?'ok':'off'}"></span>ffmpeg ${f.available?'可用':'缺失'}</div>
    <div style="margin-top:6px">活跃 ${state.overview.active_count} / 总 ${state.overview.registry.total}</div>`;
}).catch(()=>{}); }, 12000);
</script>
